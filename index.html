---
layout: null
---
<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>エッセイ置き場</title>
  <style>
    body {
      background: #a4d5bd;
      color: #626063;
      font-family: sans-serif;
      font-size: 13px;
      line-height: 2;
      margin: 0;
      padding: 30px 15px;
    }
    header, article {
      max-width: 400px;
      margin: 20px auto;
      background: #f6e5cc;
      border: 3px solid #626063;
      border-radius: 5px;
      padding: 20px;
    }
    header { text-align: center; }
    h1 { font-size: 18px; }
    h2 { font-size: 16px; }
    time { font-size: 11px; }
    .body { overflow-wrap: anywhere; }

    /* 文字と枠線を統一 */
body, h1, h2, p, time {
color: #626063;
}

header, article {
border-color: #626063;
}

/* 行間を少し詰める */
body {
line-height: 1.8;
}

/* 段落間の余白を調整 */
.body p {
margin: 0 0 0.8em;
}

/* 見出しの余白も調整 */
h1, h2 {
line-height: 1.5;
margin-top: 0.5em;
margin-bottom: 0.8em;
}
    
  </style>
</head>
<body>
  <header>
    <h1>エッセイ置き場</h1>
    <p>日々のこと、思ったこと。</p>
  </header>

  {% for post in site.posts %}
  <article>
    <time>{{ post.date | date: "%Y.%m.%d" }}</time>
    <h2>{{ post.title | escape }}</h2>
    <div class="body">
      {{ post.content }}
    </div>
  </article>
  {% endfor %}
</body>
</html>
