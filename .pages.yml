media: media

content:
  - name: posts
    label: エッセイ
    type: collection
    path: _posts
    format: yaml-frontmatter
    filename: "{year}-{month}-{day}-{hour}-{minute}-{second}.md"
    fields:
      - name: title
        label: タイトル
        type: string
        required: true
      - name: date
        label: 投稿日
        type: date
        options:
          time: true
      - name: body
        label: 本文
        type: rich-text
        options:
          format: markdown
